    <rect x="0" y="470" width="1920" height="90" fill="#fff"/>
    <rect x="0" y="650" width="1920" height="120" fill="#fff"/>
    <rect x="0" y="880" width="1920" height="160" fill="#fff"/>
  </g>
  <polygon points="880,360 1040,360 1260,1080 660,1080" fill="url(#pitch)"/>
  <g stroke="#f4f1e6" stroke-width="6" opacity="0.85">
    <line x1="860" y1="430" x2="1060" y2="430"/>
    <line x1="745" y1="900" x2="1175" y2="900"/>
  </g>
  <g fill="#f4f1e6">
    <rect x="950" y="398" width="5" height="34"/><rect x="959" y="398" width="5" height="34"/><rect x="968" y="398" width="5" height="34"/>
    <rect x="930" y="820" width="12" height="82"/><rect x="954" y="820" width="12" height="82"/><rect x="978" y="820" width="12" height="82"/>
