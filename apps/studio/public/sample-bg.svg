<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2533"/>
      <stop offset="1" stop-color="#2b3a2e"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6b34"/>
      <stop offset="1" stop-color="#1f4d25"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a77a"/>
      <stop offset="1" stop-color="#9c8a5e"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#stand)"/>
  <g opacity="0.35" filter="url(#soft)">
    <rect x="0" y="120" width="1920" height="40" fill="#3b4a63"/>
    <rect x="0" y="200" width="1920" height="30" fill="#46556e"/>
    <rect x="0" y="270" width="1920" height="26" fill="#3b4a63"/>
